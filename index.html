<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769d1">
<meta name="description" content="Ganesh Plywood ERP Business Management System">
<title>Ganesh Plywood ERP</title>

<style>
*{box-sizing:border-box}
:root{--primary:#1769d1;--primary2:#0d47a1;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--danger:#d93025;--success:#16803c;--border:#e3e8ef}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#loading{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;font-size:18px}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0d47a1,#1976d2)}
.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 60px #0003}
.logo{width:72px;height:72px;border-radius:20px;background:#e8f1ff;display:flex;align-items:center;justify-content:center;font-size:38px;margin:auto}
.login-card h1{text-align:center;margin:16px 0 5px;font-size:27px}
.login-card p{text-align:center;color:var(--muted);margin:0 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #d6dce5;border-radius:11px;outline:none;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #1769d11c}
.primary{width:100%;padding:13px;border-radius:11px;background:var(--primary);color:#fff;font-weight:700}
.secondary{padding:10px 14px;border-radius:10px;background:#eef3f9;color:#26364d;font-weight:700}
.danger{background:#fff0ef;color:var(--danger)}
.success{background:#eaf7ef;color:var(--success)}
.message{margin-top:12px;padding:10px;border-radius:10px;font-size:13px;display:none}
.message.error{display:block;background:#fff0ef;color:var(--danger)}
.message.ok{display:block;background:#eaf7ef;color:var(--success)}

#app{min-height:100vh}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:100}
.menu-btn{width:42px;height:42px;border-radius:10px;background:#eef3f9;font-size:23px}
.brand{font-weight:800;font-size:18px;flex:1}
.userbox{font-size:12px;color:var(--muted);text-align:right}
.logout{padding:9px 12px;border-radius:9px;background:#fff0ef;color:var(--danger);font-weight:700}

.layout{display:flex}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--border);min-height:calc(100vh - 68px);padding:14px;position:fixed;left:0;top:68px;z-index:90;transition:.2s}
.nav-btn{width:100%;text-align:left;padding:12px 13px;margin:3px 0;border-radius:10px;background:transparent;color:#334155;font-weight:700}
.nav-btn:hover,.nav-btn.active{background:#eaf2ff;color:var(--primary)}
.main{margin-left:250px;width:calc(100% - 250px);padding:22px;max-width:1500px}
.hero{background:linear-gradient(135deg,#1769d1,#0d47a1);color:#fff;border-radius:0 0 30px 30px;padding:28px 24px;margin:-22px -22px 22px}
.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;opacity:.9}

.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 18px}
.page-title h2{margin:0;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 5px 20px #1b2a4108}
.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:27px;font-weight:800;margin-top:8px}
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}
.module{background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;text-align:center;box-shadow:0 8px 25px #1b2a4109}
.module .icon{font-size:48px}.module h3{margin:10px 0 5px}.module p{color:var(--muted);margin:0}

.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{background:#f7f9fc;position:sticky;top:0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.badge{padding:4px 8px;border-radius:20px;background:#eef3f9;font-size:11px;font-weight:700}
.badge.low{background:#fff0ef;color:var(--danger)}
.badge.good{background:#eaf7ef;color:var(--success)}
.small{font-size:12px;color:var(--muted)}

@media(max-width:900px){
 .sidebar{transform:translateX(-105%);box-shadow:10px 0 30px #0002}
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0;width:100%;padding:16px}
 .hero{margin:-16px -16px 18px;padding:25px 18px}
 .cards{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
 .topbar{padding:0 10px}.brand{font-size:15px}.userbox{display:none}
 .cards,.module-grid,.form-grid{grid-template-columns:1fr}
 .module{padding:20px}
 .hero h1{font-size:25px}
}
</style>
</head>

<body>
<div id="loading">Loading Ganesh Plywood ERP…</div>

<section id="loginPage" class="hidden">
  <div class="login-card">
    <div class="logo">🪵</div>
    <h1>Ganesh Plywood ERP</h1>
    <p>Business Management System</p>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="Enter email">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password">
    </div>
    <button id="loginBtn" class="primary">Login</button>
    <div id="loginMsg" class="message"></div>
    <p class="small" style="margin-top:18px">Firebase Email/Password Authentication</p>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="brand">🪵 Ganesh Plywood ERP</div>
    <div class="userbox"><div id="userEmail">—</div><div>Signed in</div></div>
    <button class="logout" id="logoutBtn">Logout</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="nav-btn active" data-page="dashboard">🏠 Dashboard</button>
      <button class="nav-btn" data-page="sales">🧾 Sales & Billing</button>
      <button class="nav-btn" data-page="purchase">📦 Purchase</button>
      <button class="nav-btn" data-page="stock">🏭 Stock</button>
      <button class="nav-btn" data-page="customers">👥 Customers</button>
      <button class="nav-btn" data-page="expenses">💰 Expenses</button>
      <button class="nav-btn" data-page="reports">📊 Reports</button>
    </aside>

    <main class="main" id="content"></main>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/*
==========================================================
 FIREBASE CONFIG
==========================================================
Replace ONLY the values below with your Firebase Web App
configuration.

Firebase Console:
Project settings → Your apps → Web app → SDK setup →
Config.

Do NOT put your Firebase Admin SDK/private key here.
==========================================================
*/
const firebaseConfig = {
  apiKey: "PASTE_YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const configReady = !Object.values(firebaseConfig).some(v =>
  !v || v.includes("PASTE_YOUR") || v.includes("YOUR_")
);

const $ = id => document.getElementById(id);
const money = n => "₹" + Number(n || 0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

let app, auth, db, currentUser, currentPage="dashboard";
let cache = {products:[],customers:[],sales:[],purchases:[],expenses:[]};

function showLoginMessage(text, ok=false){
  const el=$("loginMsg"); el.textContent=text; el.className="message "+(ok?"ok":"error");
}
function today(){return new Date().toISOString().slice(0,10)}

function pageHeader(title, action=""){
  return `<div class="page-title"><h2>${title}</h2>${action}</div>`;
}

function dashboard(){
  const sales=cache.sales.reduce((a,x)=>a+Number(x.amount||0),0);
  const purchases=cache.purchases.reduce((a,x)=>a+Number(x.amount||0),0);
  const expenses=cache.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
  const low=cache.products.filter(x=>Number(x.stock||0)<=Number(x.minStock||5)).length;
  return `
  <div class="hero"><h1>Ganesh Plywood ERP</h1><p>Business Management System</p></div>
  ${pageHeader("Dashboard")}
  <div class="cards">
    <div class="card"><div class="stat-label">Total Sales</div><div class="stat-value">${money(sales)}</div></div>
    <div class="card"><div class="stat-label">Total Purchase</div><div class="stat-value">${money(purchases)}</div></div>
    <div class="card"><div class="stat-label">Expenses</div><div class="stat-value">${money(expenses)}</div></div>
    <div class="card"><div class="stat-label">Low Stock Items</div><div class="stat-value">${low}</div></div>
  </div>
  <div class="module-grid">
    <div class="module" data-go="sales"><div class="icon">🧾</div><h3>Sales</h3><p>Sales & Billing</p></div>
    <div class="module" data-go="purchase"><div class="icon">📦</div><h3>Purchase</h3><p>Purchase Entry</p></div>
    <div class="module" data-go="stock"><div class="icon">🏭</div><h3>Stock</h3><p>Inventory</p></div>
    <div class="module" data-go="customers"><div class="icon">👥</div><h3>Customers</h3><p>Customer Management</p></div>
    <div class="module" data-go="expenses"><div class="icon">💰</div><h3>Expenses</h3><p>Business Expenses</p></div>
    <div class="module" data-go="reports"><div class="icon">📊</div><h3>Reports</h3><p>Business Reports</p></div>
  </div>`;
}

function stockPage(){
 return `${pageHeader("Stock",`<button class="secondary" id="addStockBtn">＋ Add Product</button>`)}
 <div class="panel">
   <div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Stock</th><th>Min Stock</th><th>Status</th></tr></thead>
   <tbody>${cache.products.length?cache.products.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.category)}</td><td>${esc(x.unit)}</td><td>${x.stock}</td><td>${x.minStock||5}</td><td><span class="badge ${Number(x.stock||0)<=Number(x.minStock||5)?"low":"good"}">${Number(x.stock||0)<=Number(x.minStock||5)?"LOW":"OK"}</span></td></tr>`).join(""):`<tr><td colspan="6" class="empty">No products yet</td></tr>`}</tbody>
   </table></div>
 </div>
 <div id="stockForm"></div>`;
}

function productForm(){
 return `<div class="panel"><h3>Add Product</h3>
 <form id="productForm"><div class="form-grid">
 <div class="field"><label>Product Name</label><input name="name" required></div>
 <div class="field"><label>Category</label><input name="category" placeholder="Plywood / Laminate / Hardware"></div>
 <div class="field"><label>Unit</label><input name="unit" value="Sheet"></div>
 <div class="field"><label>Opening Stock</label><input name="stock" type="number" min="0" value="0" required></div>
 <div class="field"><label>Minimum Stock</label><input name="minStock" type="number" min="0" value="5"></div>
 <div class="field"><label>Purchase Rate</label><input name="purchaseRate" type="number" min="0" step="0.01" value="0"></div>
 </div><div class="form-actions"><button class="primary" style="width:auto">Save Product</button><button type="button" class="secondary" id="cancelStock">Cancel</button></div></form></div>`;
}

function customersPage(){
 return `${pageHeader("Customers",`<button class="secondary" id="addCustomerBtn">＋ Add Customer</button>`)}
 <div class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>GSTIN</th><th>Address</th></tr></thead>
 <tbody>${cache.customers.length?cache.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.gstin||"-")}</td><td>${esc(x.address||"-")}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">No customers yet</td></tr>`}</tbody></table></div></div>
 <div id="customerForm"></div>`;
}
function customerForm(){
 return `<div class="panel"><h3>Add Customer</h3><form id="customerFormEl"><div class="form-grid">
 <div class="field"><label>Name</label><input name="name" required></div>
 <div class="field"><label>Mobile</label><input name="mobile" inputmode="tel"></div>
 <div class="field"><label>GSTIN</label><input name="gstin"></div>
 <div class="field"><label>Address</label><textarea name="address"></textarea></div>
 </div><div class="form-actions"><button class="primary" style="width:auto">Save Customer</button><button type="button" class="secondary" id="cancelCustomer">Cancel</button></div></form></div>`;
}

function salesPage(){
 return `${pageHeader("Sales & Billing",`<button class="secondary" id="addSaleBtn">＋ New Sale</button>`)}
 <div class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Amount</th><th>Payment</th></tr></thead>
 <tbody>${cache.sales.length?cache.sales.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.invoiceNo||"-")}</td><td>${esc(x.customer)}</td><td>${money(x.amount)}</td><td>${esc(x.payment||"Pending")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">No sales yet</td></tr>`}</tbody></table></div></div><div id="saleForm"></div>`;
}
function saleForm(){
 return `<div class="panel"><h3>New Sale</h3><form id="saleFormEl"><div class="form-grid">
 <div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div>
 <div class="field"><label>Invoice No.</label><input name="invoiceNo" value="INV-${Date.now().toString().slice(-6)}"></div>
 <div class="field"><label>Customer</label><input name="customer" required></div>
 <div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div>
 <div class="field"><label>Payment</label><select name="payment"><option>Cash</option><option>UPI</option><option>Bank</option><option>Credit</option><option>Pending</option></select></div>
 <div class="field"><label>Notes</label><input name="notes"></div>
 </div><div class="form-actions"><button class="primary" style="width:auto">Save Sale</button><button type="button" class="secondary" id="cancelSale">Cancel</button></div></form></div>`;
}

function purchasePage(){
 return `${pageHeader("Purchase",`<button class="secondary" id="addPurchaseBtn">＋ New Purchase</button>`)}
 <div class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Bill No.</th><th>Supplier</th><th>Amount</th><th>Payment</th></tr></thead>
 <tbody>${cache.purchases.length?cache.purchases.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.billNo||"-")}</td><td>${esc(x.supplier)}</td><td>${money(x.amount)}</td><td>${esc(x.payment||"Pending")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">No purchases yet</td></tr>`}</tbody></table></div></div><div id="purchaseForm"></div>`;
}
function purchaseForm(){
 return `<div class="panel"><h3>New Purchase</h3><form id="purchaseFormEl"><div class="form-grid">
 <div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div>
 <div class="field"><label>Bill No.</label><input name="billNo" value="PUR-${Date.now().toString().slice(-6)}"></div>
 <div class="field"><label>Supplier</label><input name="supplier" required></div>
 <div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div>
 <div class="field"><label>Payment</label><select name="payment"><option>Cash</option><option>UPI</option><option>Bank</option><option>Credit</option><option>Pending</option></select></div>
 <div class="field"><label>Notes</label><input name="notes"></div>
 </div><div class="form-actions"><button class="primary" style="width:auto">Save Purchase</button><button type="button" class="secondary" id="cancelPurchase">Cancel</button></div></form></div>`;
}

function expensesPage(){
 return `${pageHeader("Expenses",`<button class="secondary" id="addExpenseBtn">＋ Add Expense</button>`)}
 <div class="panel"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Payment</th></tr></thead>
 <tbody>${cache.expenses.length?cache.expenses.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.description||"-")}</td><td>${money(x.amount)}</td><td>${esc(x.payment||"Cash")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">No expenses yet</td></tr>`}</tbody></table></div></div><div id="expenseForm"></div>`;
}
function expenseForm(){
 return `<div class="panel"><h3>Add Expense</h3><form id="expenseFormEl"><div class="form-grid">
 <div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div>
 <div class="field"><label>Category</label><select name="category"><option>Transport</option><option>Salary</option><option>Electricity</option><option>Rent</option><option>Office</option><option>Other</option></select></div>
 <div class="field"><label>Description</label><input name="description"></div>
 <div class="field"><label>Amount</label><input name="amount" type="number" min="0" step=".01" required></div>
 <div class="field"><label>Payment</label><select name="payment"><option>Cash</option><option>UPI</option><option>Bank</option><option>Card</option></select></div>
 </div><div class="form-actions"><button class="primary" style="width:auto">Save Expense</button><button type="button" class="secondary" id="cancelExpense">Cancel</button></div></form></div>`;
}

function reportsPage(){
 const sales=cache.sales.reduce((a,x)=>a+Number(x.amount||0),0);
 const purchases=cache.purchases.reduce((a,x)=>a+Number(x.amount||0),0);
 const expenses=cache.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const profit=sales-purchases-expenses;
 return `${pageHeader("Reports")}
 <div class="cards">
 <div class="card"><div class="stat-label">Sales</div><div class="stat-value">${money(sales)}</div></div>
 <div class="card"><div class="stat-label">Purchase</div><div class="stat-value">${money(purchases)}</div></div>
 <div class="card"><div class="stat-label">Expenses</div><div class="stat-value">${money(expenses)}</div></div>
 <div class="card"><div class="stat-label">Gross Position</div><div class="stat-value">${money(profit)}</div></div>
 </div>
 <div class="panel" style="margin-top:18px"><h3>Data Summary</h3>
 <p>Products: <b>${cache.products.length}</b> &nbsp; Customers: <b>${cache.customers.length}</b> &nbsp; Sales: <b>${cache.sales.length}</b> &nbsp; Purchases: <b>${cache.purchases.length}</b> &nbsp; Expenses: <b>${cache.expenses.length}</b></p>
 <p class="small">This report is calculated from the records currently stored in Firestore.</p></div>`;
}

async function loadCollection(name){
 if(!db) return [];
 try{
   const snap=await getDocs(collection(db,name));
   return snap.docs.map(d=>({id:d.id,...d.data()}));
 }catch(e){console.error(name,e); return []}
}
async function refreshData(){
 [cache.products,cache.customers,cache.sales,cache.purchases,cache.expenses]=await Promise.all([
   loadCollection("products"),loadCollection("customers"),loadCollection("sales"),loadCollection("purchases"),loadCollection("expenses")
 ]);
}

async function saveRecord(name,data){
 await addDoc(collection(db,name),{
   ...data, createdBy:currentUser?.uid||null, createdAt:serverTimestamp()
 });
 await refreshData(); render();
}

async function render(){
 if(!currentUser) return;
 await refreshData();
 let html="";
 if(currentPage==="dashboard") html=dashboard();
 if(currentPage==="sales") html=salesPage();
 if(currentPage==="purchase") html=purchasePage();
 if(currentPage==="stock") html=stockPage();
 if(currentPage==="customers") html=customersPage();
 if(currentPage==="expenses") html=expensesPage();
 if(currentPage==="reports") html=reportsPage();
 $("content").innerHTML=html;
 bindPage();
}
function bindPage(){
 document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));
 document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{currentPage=el.dataset.go;render();});
 $("addStockBtn")?.addEventListener("click",()=>{$("stockForm").innerHTML=productForm()});
 $("cancelStock")?.addEventListener("click",()=>{$("stockForm").innerHTML=""});
 $("productForm")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);await saveRecord("products",{name:f.get("name"),category:f.get("category"),unit:f.get("unit"),stock:Number(f.get("stock")),minStock:Number(f.get("minStock")),purchaseRate:Number(f.get("purchaseRate"))});});
 $("addCustomerBtn")?.addEventListener("click",()=>{$("customerForm").innerHTML=customerForm()});
 $("cancelCustomer")?.addEventListener("click",()=>{$("customerForm").innerHTML=""});
 $("customerFormEl")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);await saveRecord("customers",{name:f.get("name"),mobile:f.get("mobile"),gstin:f.get("gstin"),address:f.get("address")});});
 $("addSaleBtn")?.addEventListener("click",()=>{$("saleForm").innerHTML=saleForm()});
 $("cancelSale")?.addEventListener("click",()=>{$("saleForm").innerHTML=""});
 $("saleFormEl")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);await saveRecord("sales",{date:f.get("date"),invoiceNo:f.get("invoiceNo"),customer:f.get("customer"),amount:Number(f.get("amount")),payment:f.get("payment"),notes:f.get("notes")});});
 $("addPurchaseBtn")?.addEventListener("click",()=>{$("purchaseForm").innerHTML=purchaseForm()});
 $("cancelPurchase")?.addEventListener("click",()=>{$("purchaseForm").innerHTML=""});
 $("purchaseFormEl")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);await saveRecord("purchases",{date:f.get("date"),billNo:f.get("billNo"),supplier:f.get("supplier"),amount:Number(f.get("amount")),payment:f.get("payment"),notes:f.get("notes")});});
 $("addExpenseBtn")?.addEventListener("click",()=>{$("expenseForm").innerHTML=expenseForm()});
 $("cancelExpense")?.addEventListener("click",()=>{$("expenseForm").innerHTML=""});
 $("expenseFormEl")?.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);await saveRecord("expenses",{date:f.get("date"),category:f.get("category"),description:f.get("description"),amount:Number(f.get("amount")),payment:f.get("payment")});});
}

document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>{currentPage=b.dataset.page;$("sidebar").classList.remove("open");render();}));
$("menuBtn").addEventListener("click",()=>$("sidebar").classList.toggle("open"));
$("logoutBtn").addEventListener("click",()=>signOut(auth));

if(!configReady){
 $("loading").classList.add("hidden");
 $("loginPage").classList.remove("hidden");
 showLoginMessage("Firebase config is missing. Add your Web App config in index.html before logging in.");
 $("loginBtn").disabled=true;
}else{
 app=initializeApp(firebaseConfig);
 auth=getAuth(app);
 db=getFirestore(app);

 $("loginBtn").addEventListener("click",async()=>{
   const email=$("loginEmail").value.trim(), password=$("loginPassword").value;
   if(!email||!password){showLoginMessage("Email and password are required.");return}
   $("loginBtn").disabled=true;
   try{await signInWithEmailAndPassword(auth,email,password);showLoginMessage("Login successful.",true)}
   catch(e){showLoginMessage(e.code==="auth/invalid-credential"?"Invalid email or password.":e.message)}
   finally{$("loginBtn").disabled=false}
 });
 $("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});

 onAuthStateChanged(auth,async user=>{
   $("loading").classList.add("hidden");
   if(user){
     currentUser=user;$("loginPage").classList.add("hidden");$("app").classList.remove("hidden");
     $("userEmail").textContent=user.email||"User";await render();
   }else{
     currentUser=null;$("app").classList.add("hidden");$("loginPage").classList.remove("hidden");
   }
 });
}
</script>
</body>
</html>
